apiVersion: apps/v1
kind: Deployment
metadata:
 name: frontend
 namespace: roboshop 
 labels:
  project: roboshop
  tier: frontend
  component: frontend
spec:
 replicas: 1
 selector:
  matchLabels:
   project: roboshop
   tier: frontend
   component: frontend
 template:
  metadata:
   labels:
    project: roboshop
    tier: frontend
    component: frontend
  spec:
   containers:
    - name: nginx
      image: sivamedam/frontend:1.4.0
      resources:
       requests:
        cpu: "100m"
        memory: "128Mi"
       limits:
        cpu: "200m"
        memory: "256Mi"
      readinessProbe:
       tcpSocket: 
        port: 80
       failureThreshold: 2
       periodSeconds: 10
       initialDelaySeconds: 15
      livenessProbe:
       httpGet:
        path: /
        port: 80
       failureThreshold: 2
       periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
 name: frontend
 namespace: roboshop
 labels:
  project: roboshop
  tier: frontend
  component: frontend
spec:
 type: LoadBalancer
 selector:
  project: roboshop
  tier: frontend
  component: frontend
 ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  